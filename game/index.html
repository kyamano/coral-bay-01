<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Coral Bay — an original open-world crime game for the desktop browser. Steal cars, run Mara's ledger, dodge the CBPD.">
<title>Coral Bay — Open-World Crime Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1420; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Coral Bay: an open-world crime game. Walk and drive around a coastal city, steal cars, run missions, and evade the police."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
